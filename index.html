<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeFrame AI - Kids Cartoon Generator</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #1a1d27;
            --accent-color: #7c4dff;
            --accent-hover: #651fff;
            --text-main: #ffffff;
            --text-sub: #9e9e9e;
            --border-color: #2a2d3d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            color: var(--accent-color);
        }

        header p {
            margin: 5px 0 0 0;
            color: var(--text-sub);
            font-size: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-sub);
        }

        input[type="file"], input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            background-color: #0f1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #4a4a4a;
            cursor: not-allowed;
        }

        #imagePreview {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
        }

        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            color: #ffd54f;
        }

        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            background: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>FreeFrame AI</h1>
        <p>Kids Cartoon Image-to-Video Generator</p>
    </header>

    <div class="card">
        <h2>1. Replicate API Key</h2>
        <label for="apiKeyInput">API Key (r8_...)</label>
        <input type="password" id="apiKeyInput" placeholder="Paste your Replicate API Token here">
    </div>

    <div class="card">
        <h2>2. Upload Cartoon Character Image</h2>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
        <img id="imagePreview" alt="Cartoon Image preview">
    </div>

    <div class="card">
        <h2>3. Describe Cartoon Animation</h2>
        <label for="promptInput">Animation Prompt</label>
        <textarea id="promptInput" placeholder="E.g., Funny kids cartoon, character smiling and opening mouth wide, head bouncing up and down, cheerful expressions..."></textarea>

        <button id="generateBtn" onclick="generateCartoonVideo()">Generate Cartoon Video</button>
        <div id="statusMessage"></div>
    </div>

    <div class="card">
        <h2>4. Generated Video</h2>
        <video id="videoResult" controls autoplay loop playsinline></video>
    </div>
</div>

<script>
    let base64Image = "";

    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                base64Image = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function generateCartoonVideo() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const promptText = document.getElementById('promptInput').value || "Cute cartoon character moving, facial expressions, bouncing motion";
        const statusMsg = document.getElementById('statusMessage');
        const generateBtn = document.getElementById('generateBtn');
        const videoResult = document.getElementById('videoResult');

        if (!apiKey) {
            alert('Kripya apni Replicate API Key daalein!');
            return;
        }

        if (!base64Image) {
            alert('Kripya pehle ek cartoon character image upload karein!');
            return;
        }

        generateBtn.disabled = true;
        statusMsg.innerText = 'AI Cartoon model process kar raha hai... Kripya 30-60 sec wait karein...';
        videoResult.style.display = 'none';

        try {
            const proxy = "https://api.allorigins.win/raw?url=";
            const targetUrl = "https://api.replicate.com/v1/predictions";
            
            const response = await fetch(proxy + encodeURIComponent(targetUrl), {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    version: "3f0457e4619da25d0d036109a9b068d3976b4d080282aa9e1a0d8e00e9d6d7c3",
                    input: {
                        input_image: base64Image,
                        prompt: promptText,
                        motion_bucket_id: 180,
                        cond_aug: 0.02
                    }
                })
            });

            const data = await response.json();

            if (!response.ok || data.error) {
                throw new Error(data.error || "API Key invalid hai ya account balance khatam ho gaya hai.");
            }

            let pollUrl = proxy + encodeURIComponent(data.urls.get);
            let finalVideoUrl = "";

            while (true) {
                await new Promise(res => setTimeout(res, 4000));
                const pollRes = await fetch(pollUrl, {
                    headers: { "Authorization": `Bearer ${apiKey}` }
                });
                const pollData = await pollRes.json();

                if (pollData.status === "succeeded") {
                    finalVideoUrl = Array.isArray(pollData.output) ? pollData.output[0] : pollData.output;
                    break;
                } else if (pollData.status === "failed" || pollData.status === "canceled") {
                    throw new Error("Video generation fail ho gaya. Image ya prompt change karke try karein.");
                }
                statusMsg.innerText = `Status: ${pollData.status}... Cartoon AI render ho raha hai...`;
            }

            if (finalVideoUrl) {
                videoResult.src = finalVideoUrl;
                videoResult.style.display = 'block';
                videoResult.load();
                videoResult.play();
                statusMsg.innerText = 'Cartoon Video successfully generate ho gaya!';
            }

        } catch (err) {
            console.error(err);
            statusMsg.innerText = 'Error: ' + err.message;
        } finally {
            generateBtn.disabled = false;
        }
    }
</script>

</body>
</html>
