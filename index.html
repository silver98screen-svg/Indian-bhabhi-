<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeFrame AI - Image to Video</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #1a1d27;
            --accent-color: #7c4dff;
            --accent-hover: #651fff;
            --text-main: #ffffff;
            --text-sub: #9e9e9e;
            --border-color: #2a2d3d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            color: var(--accent-color);
        }

        header p {
            margin: 5px 0 0 0;
            color: var(--text-sub);
            font-size: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-sub);
        }

        input[type="file"], textarea, select {
            width: 100%;
            padding: 10px;
            background-color: #0f1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #4a4a4a;
            cursor: not-allowed;
        }

        #imagePreview {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
        }

        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            color: #ffd54f;
        }

        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            background: #000;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>FreeFrame AI</h1>
        <p>Free Image-to-Video Generator</p>
    </header>

    <div class="card">
        <h2>1. Upload Image</h2>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
        <img id="imagePreview" alt="Image preview">
    </div>

    <div class="card">
        <h2>2. Describe & Duration</h2>
        <label for="promptInput">Video prompt</label>
        <textarea id="promptInput" placeholder="Describe the motion e.g., camera zoom in, slow movement..."></textarea>

        <label for="durationSelect">Video Duration (Length)</label>
        <select id="durationSelect">
            <option value="120000" selected>2 Minutes (120 Sec)</option>
            <option value="60000">1 Minute (60 Sec)</option>
            <option value="30000">30 Seconds</option>
            <option value="10000">10 Seconds</option>
        </select>

        <button id="generateBtn" onclick="generateVideo()">Generate Video</button>
        <div id="statusMessage"></div>
    </div>

    <div class="card">
        <h2>3. Your video</h2>
        <video id="videoResult" controls autoplay loop playsinline></video>
        <canvas id="animCanvas"></canvas>
    </div>
</div>

<script>
    let uploadedImgObj = new Image();
    let isImageLoaded = false;

    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                uploadedImgObj.src = e.target.result;
                uploadedImgObj.onload = () => { isImageLoaded = true; };
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function generateVideo() {
        const statusMsg = document.getElementById('statusMessage');
        const generateBtn = document.getElementById('generateBtn');
        const videoResult = document.getElementById('videoResult');
        const canvas = document.getElementById('animCanvas');
        const durationSelect = document.getElementById('durationSelect');
        const ctx = canvas.getContext('2d');

        if (!isImageLoaded) {
            alert('Kripya pehle ek image upload karein!');
            return;
        }

        const duration = parseInt(durationSelect.value); // Selected time (default 2 mins)
        generateBtn.disabled = true;
        statusMsg.innerText = `AI 2-minute video render kar raha hai... Kripya thoda wait karein...`;
        videoResult.style.display = 'none';

        try {
            canvas.width = uploadedImgObj.naturalWidth || 640;
            canvas.height = uploadedImgObj.naturalHeight || 360;

            const stream = canvas.captureStream(30); // 30 FPS
            let mediaRecorder;
            let recordedChunks = [];

            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                const videoUrl = URL.createObjectURL(blob);
                videoResult.src = videoUrl;
                videoResult.style.display = 'block';
                videoResult.load();
                videoResult.play();
                statusMsg.innerText = '2 Minute ka video successfully generate ho gaya hai!';
                generateBtn.disabled = false;
            };

            mediaRecorder.start();

            let startTime = performance.now();

            function animate(currentTime) {
                let elapsed = currentTime - startTime;
                let progress = Math.min(elapsed / duration, 1);

                // Smooth slow breathing motion for 2 minutes
                let scale = 1 + (Math.sin(progress * Math.PI * 4) * 0.08);
                let shiftX = Math.sin(progress * Math.PI * 2) * 20;

                ctx.save();
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.translate(canvas.width / 2 + shiftX, canvas.height / 2);
                ctx.scale(scale, scale);
                ctx.drawImage(uploadedImgObj, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
                ctx.restore();

                if (progress < 1) {
                    // Update progress status every few seconds
                    let secondsRemaining = Math.ceil((duration - elapsed) / 1000);
                    statusMsg.innerText = `Video rendering in progress... (${secondsRemaining} sec remaining)`;
                    requestAnimationFrame(animate);
                } else {
                    setTimeout(() => { mediaRecorder.stop(); }, 200);
                }
            }

            requestAnimationFrame(animate);

        } catch (error) {
            console.error(error);
            statusMsg.innerText = 'Error: Video render nahi ho paya. Dobara try karein.';
            generateBtn.disabled = false;
        }
    }
</script>

</body>
</html>
