<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeFrame AI - Image to Video</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #1a1d27;
            --accent-color: #7c4dff;
            --accent-hover: #651fff;
            --text-main: #ffffff;
            --text-sub: #9e9e9e;
            --border-color: #2a2d3d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            color: var(--accent-color);
        }

        header p {
            margin: 5px 0 0 0;
            color: var(--text-sub);
            font-size: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-sub);
        }

        input[type="file"], textarea, select, input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: #0f1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #4a4a4a;
            cursor: not-allowed;
        }

        #imagePreview {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
        }

        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            color: #ffd54f;
        }

        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>FreeFrame AI</h1>
        <p>Free Image-to-Video Generator</p>
    </header>

    <div class="card">
        <h2>1. Upload Image</h2>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
        <img id="imagePreview" alt="Image preview">
    </div>

    <div class="card">
        <h2>2. Describe your video</h2>
        <label for="promptInput">Video prompt</label>
        <textarea id="promptInput" placeholder="Describe the motion e.g., camera zoom in, clouds moving..."></textarea>

        <button id="generateBtn" onclick="generateVideo()">Generate Video</button>
        <div id="statusMessage"></div>
    </div>

    <div class="card">
        <h2>3. Your video</h2>
        <video id="videoResult" controls></video>
    </div>
</div>

<script>
    // AAPKA HUGGING FACE TOKEN YAHAN PASTE KAREIN
    const HF_TOKEN = "PASTE_YOUR_HUGGINGFACE_TOKEN_HERE";

    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function generateVideo() {
        const imageInput = document.getElementById('imageInput');
        const promptInput = document.getElementById('promptInput').value;
        const statusMsg = document.getElementById('statusMessage');
        const generateBtn = document.getElementById('generateBtn');
        const videoResult = document.getElementById('videoResult');

        if (!imageInput.files[0]) {
            alert('Kripya pehle ek image upload karein!');
            return;
        }

        if (HF_TOKEN === "PASTE_YOUR_HUGGINGFACE_TOKEN_HERE" || !HF_TOKEN) {
            alert('Kripya index.html mein apna real Hugging Face Token add karein!');
            return;
        }

        generateBtn.disabled = true;
        statusMsg.innerText = 'AI model connecting... Video generate hone mein 1-2 minute lag sakte hain...';
        videoResult.style.display = 'none';

        try {
            const imageFile = imageInput.files[0];
            const formData = new FormData();
            formData.append("inputs", imageFile);
            if (promptInput) {
                formData.append("parameters", JSON.stringify({ prompt: promptInput }));
            }

            // Using Hugging Face Image-to-Video Model
            const response = await fetch(
                "https://api-inference.huggingface.co/models/stabilityai/stable-video-diffusion-img2vid-xt",
                {
                    headers: { Authorization: `Bearer ${HF_TOKEN}` },
                    method: "POST",
                    body: imageFile,
                }
            );

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                if (errData.error && errData.error.includes("currently loading")) {
                    statusMsg.innerText = "Model load ho raha hai... Kripya 30 seconds baad dobara try karein.";
                } else {
                    statusMsg.innerText = "Error: " + (errData.error || response.statusText);
                }
                generateBtn.disabled = false;
                return;
            }

            const blob = await response.blob();
            const videoUrl = URL.createObjectURL(blob);
            videoResult.src = videoUrl;
            videoResult.style.display = 'block';
            statusMsg.innerText = 'Video tayar ho gaya hai!';
        } catch (error) {
            console.error(error);
            statusMsg.innerText = 'Video generation mein error aaya. Kripya dobara try karein.';
        } finally {
            generateBtn.disabled = false;
        }
    }
</script>

</body>
</html>
